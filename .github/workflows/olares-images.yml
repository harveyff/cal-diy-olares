name: Build Olares Cal.diy images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SOURCE_SHA: 54343aa685ae8f33159d2f485ec4a57bad5c574a
  IMAGE_TAG: 54343aa-amd64

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Prepare build database
        run: |
          grep -o '^[^#]*' .env.example > .env
          docker compose up -d database
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=container:database
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/harveyff/cal-diy-web:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000
            NEXT_PUBLIC_API_V2_URL=http://localhost:5555/api/v2
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            DATABASE_URL=postgresql://unicorn_user:magical_password@localhost:5432/calendso
            DATABASE_DIRECT_URL=postgresql://unicorn_user:magical_password@localhost:5432/calendso

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/v2/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/harveyff/cal-diy-api:${{ env.IMAGE_TAG }}
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/calendso
            DATABASE_DIRECT_URL=postgresql://postgres:postgres@localhost:5432/calendso